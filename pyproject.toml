[project]
name = "nanoserve"
version = "0.0.1"
description = "A mini LLM inference engine built from scratch: continuous batching, paged KV cache, speculative decoding, Triton kernels."
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.9",          # CUDA build from the PyTorch index below; bundles Triton
  "transformers>=4.57",  # reference implementation + tokenizer only
  "accelerate>=1.0",
  "numpy>=2.0",
  "httpx>=0.27",         # async streaming client for OpenAI-compatible servers
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "gpu: needs a CUDA GPU and downloads the model (deselect with -m 'not gpu')",
  "spec: speculative decoding tests (1.5B model, ~8 GB RAM); run separately with: pytest -m spec",
]
addopts = "-m 'not spec'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanoserve", "bench"]
